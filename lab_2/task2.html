<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <h2>Conference Registration Form:</h2>

    <form action="">
        Full Name:<br>
        <input type="text" placeholder="Enter your full name" required><br><br>

        Email Address:<br>
        <input type="email" placeholder="Enter your email address" required><br><br>

        Age:<br>
        <input type="number" placeholder="18" min="18" max="99" required><br><br>

        Gender:<br>
        <input type="radio" name="gender" value="male">Male<br>
        <input type="radio" name="gender" value="female">Female<br><br>

        Country of Residence:<br>
        <select>
            <option value="Malaysia" selected>Malaysia</option>
            <option value="China">China</option>
            <option value="Nigeria">Nigeria</option>
        <option value="Dubai">Dubai</option>
        </select><br><br>

        Areas of Interest:<br>
        <input type="checkbox" name="interest" value="Web Developement">Web Development<br>
        <input type="checkbox" name="interest" value="Data Science">Data Science<br>
        <input type="checkbox" name="interest" value="Security">Cybersecurity<br>
       
        Experience Level:<br>
        <input type="radio" name="exp" value="Beginner">Beginner<br>
        <input type="radio" name="exp" value="Intermediate">Intermediate<br>
        <input type="radio" name="exp" value="Advanced">Advanced<br><br>

        Comments or Questions:<br>
        <textarea rows="4" cols="50" placeholder="Any comments or questions?"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
